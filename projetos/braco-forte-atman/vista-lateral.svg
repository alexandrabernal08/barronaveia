<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 1000 680" font-family="Arial, Helvetica, sans-serif" font-size="15">
  <!-- Escala: 1 unidade = 1 mm. Medidas de exemplo (torno com cabeça a 520 mm do chão, a 420 mm do poste). -->
  <rect x="0" y="30" width="1000" height="680" fill="#ffffff"/>
  <text x="20" y="58" font-size="20" font-weight="bold" fill="#333">Vista lateral (esquemática, medidas em mm)</text>
  <text x="20" y="80" font-size="13" fill="#666">Os dois braços giram independentes em torno do poste; aqui aparecem no mesmo plano só para mostrar alturas.</text>

  <!-- Bacia do torno -->
  <path d="M300,420 L300,520 L840,520 L840,420" fill="#f2f2f2" stroke="#999" stroke-width="6"/>
  <!-- Cabeça do torno + eixo -->
  <rect x="560" y="500" width="20" height="60" fill="#888"/>
  <rect x="420" y="480" width="300" height="20" fill="#b0b0b0" stroke="#666"/>

  <!-- Barro -->
  <path d="M480,480 C480,380 510,350 570,350 C630,350 660,380 660,480 Z" fill="#c8875a" fill-opacity="0.45" stroke="#a0623a" stroke-dasharray="4 3"/>

  <!-- Fixação (ver opções no README) -->
  <rect x="100" y="560" width="100" height="60" fill="#ddd" stroke="#777" stroke-dasharray="6 4"/>
  <text x="210" y="600" font-size="13" fill="#444">FIXAÇÃO (ver opções)</text>

  <!-- Poste Ø25 -->
  <rect x="137.5" y="228" width="25" height="392" fill="#9aa3ad" stroke="#555"/>

  <!-- Colar trava inferior -->
  <rect x="128" y="388" width="44" height="14" fill="#555"/>

  <!-- Braço inferior (centralizador) caibro 50x70 -->
  <path d="M70,318 L650,318 L710,333 L838,333 Q852,353 838,373 L710,373 L650,388 L70,388 Z" fill="#e3c08a" stroke="#8a6a3a" stroke-width="2"/>
  <text x="230" y="359" font-size="17" fill="#5a4220" font-weight="bold">BRAÇO INFERIOR — centraliza</text>

  <!-- Chapa inox com rasgos verticais -->
  <rect x="630" y="340" width="130" height="130" rx="8" fill="#cfd6dc" fill-opacity="0.85" stroke="#555" stroke-width="2"/>
  <rect x="655" y="345" width="10" height="34" rx="5" fill="#fff" stroke="#555"/>
  <rect x="725" y="345" width="10" height="34" rx="5" fill="#fff" stroke="#555"/>

  <!-- Arruela de nylon -->
  <rect x="120" y="316" width="60" height="2" fill="#333"/>

  <!-- Bloco 50x70x190 -->
  <rect x="70" y="246" width="190" height="70" fill="#d9b278" stroke="#8a6a3a" stroke-width="2"/>

  <!-- Colar trava superior -->
  <rect x="128" y="230" width="44" height="14" fill="#555"/>

  <!-- Batente com borracha -->
  <rect x="210" y="222" width="50" height="24" fill="#c49a5e" stroke="#8a6a3a"/>
  <rect x="210" y="219" width="50" height="3" fill="#222"/>

  <!-- Braço superior: posição levantada (tracejado) -->
  <g transform="rotate(-6 100 188)">
    <path d="M100,158 L760,158 L820,171 L918,171 Q932,188 918,205 L820,205 L760,218 L100,218 A30,30 0 0,1 100,158 Z" fill="none" stroke="#8a6a3a" stroke-dasharray="8 6"/>
  </g>

  <!-- Braço superior: apoiado no batente (posição de fundo) -->
  <path d="M100,158 L760,158 L820,171 L918,171 Q932,188 918,205 L820,205 L760,218 L100,218 A30,30 0 0,1 100,158 Z" fill="#e3c08a" stroke="#8a6a3a" stroke-width="2"/>
  <text x="200" y="194" font-size="17" fill="#5a4220" font-weight="bold">BRAÇO SUPERIOR — abre</text>
  <!-- rasgo (passante, oculto) -->
  <rect x="450" y="158" width="250" height="60" fill="none" stroke="#5a4220" stroke-dasharray="5 4"/>

  <!-- Placas da dobradiça (dos dois lados do bloco) -->
  <rect x="70" y="165" width="60" height="135" rx="6" fill="#aab3bb" fill-opacity="0.85" stroke="#444" stroke-width="2"/>
  <circle cx="100" cy="188" r="7" fill="#333"/>
  <circle cx="85" cy="282" r="5" fill="#333"/>
  <circle cx="115" cy="282" r="5" fill="#333"/>

  <!-- Haste M12 + ponteira -->
  <rect x="564" y="70" width="12" height="320" fill="#b8c0c8" stroke="#555"/>
  <rect x="548" y="146" width="44" height="12" rx="3" fill="#222"/>
  <rect x="548" y="218" width="44" height="12" rx="3" fill="#222"/>
  <path d="M554,390 L586,390 L586,454 A16,16 0 0,1 554,454 Z" fill="#f5f5f0" stroke="#555" stroke-width="2"/>

  <!-- Rótulos -->
  <text x="20" y="150" font-size="13" fill="#333">dobradiça</text>
  <line x1="60" y1="155" x2="78" y2="172" stroke="#333"/>
  <text x="275" y="240" font-size="13" fill="#333">batente c/ borracha</text>
  <text x="180" y="417" font-size="13" fill="#333">colar trava</text>
  <text x="180" y="540" font-size="13" fill="#333">poste Ø25 aço</text>
  <line x1="178" y1="536" x2="163" y2="520" stroke="#333"/>
  <text x="600" y="110" font-size="13" fill="#333">haste roscada M12 inox</text>
  <text x="600" y="126" font-size="13" fill="#333">+ 2 manípulos e arruelas largas</text>
  <text x="330" y="450" font-size="13" fill="#333">ponteira nylon</text>
  <line x1="420" y1="446" x2="552" y2="440" stroke="#333"/>
  <text x="780" y="300" font-size="13" fill="#333">chapa inox 130×130</text>
  <text x="780" y="316" font-size="13" fill="#333">(rasgos = ajuste de altura)</text>
  <line x1="790" y1="303" x2="740" y2="342" stroke="#333"/>
  <text x="900" y="245" font-size="12" fill="#777" text-anchor="end">tracejado = braço levantado</text>

  <!-- Referências de altura -->
  <line x1="725" y1="480" x2="985" y2="480" stroke="#c33" stroke-dasharray="4 3"/>
  <text x="985" y="474" text-anchor="end" font-size="13" fill="#c33">B = topo da cabeça</text>
  <line x1="845" y1="420" x2="985" y2="420" stroke="#c33" stroke-dasharray="4 3"/>
  <text x="985" y="414" text-anchor="end" font-size="13" fill="#c33">C = borda da bacia</text>
  <line x1="855" y1="388" x2="985" y2="388" stroke="#36c" stroke-dasharray="4 3"/>
  <text x="985" y="383" text-anchor="end" font-size="12" fill="#36c">fundo braço inf. = C + 30</text>
  <line x1="590" y1="470" x2="985" y2="470" stroke="#393" stroke-dasharray="2 3"/>
  <text x="985" y="497" text-anchor="end" font-size="12" fill="#393">fundo da peça ≈ 10 mm</text>

  <!-- Cota A -->
  <line x1="150" y1="630" x2="150" y2="680" stroke="#c33"/>
  <line x1="570" y1="560" x2="570" y2="680" stroke="#c33"/>
  <line x1="150" y1="665" x2="570" y2="665" stroke="#c33" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="360" y="658" text-anchor="middle" font-size="14" fill="#c33">A = poste → centro da cabeça (ex.: 420)</text>
  <text x="360" y="698" text-anchor="middle" font-size="13" fill="#666">braço inferior 780 · braço superior 860 · rasgo de 300 a 550 a partir do poste</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c33"/>
    </marker>
  </defs>
</svg>
