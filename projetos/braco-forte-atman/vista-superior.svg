<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="Arial, Helvetica, sans-serif" font-size="15">
  <!-- Escala: 1 unidade = 1 mm. Poste em (150,360); centro da cabeça a 420 mm do poste. -->
  <rect x="0" y="0" width="1000" height="760" fill="#ffffff"/>
  <text x="20" y="30" font-size="20" font-weight="bold" fill="#333">Vista de cima (medidas em mm)</text>

  <!-- Bacia e cabeça -->
  <circle cx="570" cy="360" r="270" fill="#f2f2f2" stroke="#999" stroke-width="6"/>
  <circle cx="570" cy="360" r="150" fill="#d0d0d0" stroke="#666"/>
  <circle cx="570" cy="360" r="90" fill="#c8875a" fill-opacity="0.45" stroke="#a0623a" stroke-dasharray="4 3"/>
  <text x="570" y="500" text-anchor="middle" font-size="13" fill="#555">cabeça do torno</text>
  <text x="770" y="610" font-size="13" fill="#777">bacia</text>

  <!-- Trajetória da chapa -->
  <path d="M662.1,173.6 A545,545 0 0,1 596.4,672.6" fill="none" stroke="#36c" stroke-dasharray="6 5" stroke-width="2"/>
  <text x="700" y="160" font-size="13" fill="#36c">trajetória da chapa (giro do braço inferior)</text>

  <!-- Braço inferior, girado 30° para fora -->
  <g transform="rotate(30 150 360)">
    <path d="M70,335 L650,335 L710,345 L838,345 Q852,360 838,375 L710,375 L650,385 L70,385 Z" fill="#e3c08a" stroke="#8a6a3a" stroke-width="2"/>
    <rect x="630" y="331" width="130" height="4" fill="#555"/>
    <text x="300" y="366" font-size="15" fill="#5a4220" font-weight="bold">braço inferior</text>
    <text x="640" y="322" font-size="12" fill="#333">chapa inox</text>
  </g>

  <!-- Braço superior, sobre o centro -->
  <g>
    <rect x="70" y="335" width="190" height="50" fill="none" stroke="#8a6a3a" stroke-dasharray="4 3"/>
    <path d="M100,335 L760,335 L820,345 L918,345 Q932,360 918,375 L820,375 L760,385 L100,385 A25,25 0 0,1 100,335 Z" fill="#e3c08a" fill-opacity="0.95" stroke="#8a6a3a" stroke-width="2"/>
    <rect x="450" y="353" width="250" height="14" rx="7" fill="#fff" stroke="#5a4220"/>
    <rect x="70" y="330" width="60" height="5" fill="#666"/>
    <rect x="70" y="385" width="60" height="5" fill="#666"/>
    <circle cx="570" cy="360" r="20" fill="#222"/>
    <circle cx="570" cy="360" r="6" fill="#b8c0c8"/>
    <text x="230" y="366" font-size="15" fill="#5a4220" font-weight="bold">braço superior</text>
  </g>

  <!-- Poste e colar -->
  <circle cx="150" cy="360" r="22" fill="#555"/>
  <circle cx="150" cy="360" r="12.5" fill="#9aa3ad" stroke="#333"/>

  <!-- Rótulos -->
  <text x="40" y="300" font-size="13" fill="#333">poste + colar trava</text>
  <line x1="110" y1="304" x2="145" y2="340" stroke="#333"/>
  <text x="40" y="430" font-size="13" fill="#333">placas da dobradiça</text>
  <line x1="90" y1="418" x2="95" y2="392" stroke="#333"/>
  <text x="600" y="420" font-size="13" fill="#333">haste sobre o centro</text>
  <line x1="610" y1="408" x2="580" y2="372" stroke="#333"/>
  <text x="470" y="300" font-size="13" fill="#5a4220">rasgo 14 mm (300 a 550 do poste)</text>

  <!-- Cota A -->
  <line x1="150" y1="50" x2="150" y2="330" stroke="#c33" stroke-dasharray="3 3"/>
  <line x1="570" y1="50" x2="570" y2="88" stroke="#c33" stroke-dasharray="3 3"/>
  <line x1="150" y1="62" x2="570" y2="62" stroke="#c33" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="360" y="55" text-anchor="middle" font-size="14" fill="#c33">A (ex.: 420)</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c33"/>
    </marker>
  </defs>
</svg>
